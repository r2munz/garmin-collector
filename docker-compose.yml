services:
  garmin-collector:
    build: .
    container_name: garmin-collector
    env_file:
      - .env
    environment:
      - OUTPUT_DIR=/data
      - TOKEN_DIR=/tokens
      # Sync window (see README § Docker). Values can be overridden in `.env` on the host.
      # Unset SYNC_START / SYNC_END → first run: Jan 1 → today; later runs: last N days.
      - SYNC_LOOKBACK_DAYS=${SYNC_LOOKBACK_DAYS:-7}
      - SYNC_START=${SYNC_START:-}
      - SYNC_END=${SYNC_END:-}
    volumes:
      # Monthly Markdown KB (activities_YYYY-MM.md) — persists across container runs
      - garmin_data:/data
      # Garmin session tokens
      - garmin_tokens:/tokens
      # Alternative: mount a host folder instead of the named volume, e.g.:
      # - /path/on/host/knowledge_base/garmin:/data
    # Uncomment below for automatic retries (e.g. with Watchtower or an external scheduler).
    # By default the container exits when the sync finishes.
    # restart: on-failure

volumes:
  garmin_data:
  garmin_tokens:
